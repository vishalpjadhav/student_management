<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Registration Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; max-width: 450px; width: 100%; padding: 35px; }
        .brand-logo { font-size: 28px; font-weight: bold; color: #0d6efd; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-logo">📝 Faculty Sign Up</div>
        
        {% if error %}
        <div class="alert alert-danger p-2 text-center" style="font-size:14px;">{{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success p-2 text-center" style="font-size:14px;">{{ success }}</div>
        {% endif %}

        <form action="/register_faculty" method="POST">
            <div class="mb-3">
                <label class="form-label">Employee Registration ID</label>
                <input type="text" name="emp_id" class="form-control" placeholder="e.g. EMP2026" required autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Prof. Vishal" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Create Security Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Create Faculty Account</button>
            
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none" style="font-size:14px;">← Back to Portal Login</a>
            </div>
        </form>
    </div>

</body>
</html>
